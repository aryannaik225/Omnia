# Omnia permission sets. `allow-<command>` permissions are autogenerated by build.rs.

[[set]]
identifier = "catalog-window"
description = "Everything the local catalog UI may call: profiles, settings, catalog cache, deep links, history, hubs, watchlist, player control and imports."
permissions = [
  "allow-list-profiles",
  "allow-create-profile",
  "allow-update-profile",
  "allow-delete-profile",
  "allow-get-setting",
  "allow-set-setting",
  "allow-get-all-settings",
  "allow-delete-setting",
  "allow-list-ott-profile-mappings",
  "allow-upsert-ott-profile-mapping",
  "allow-delete-ott-profile-mapping",
  "allow-list-subscribed-providers",
  "allow-set-subscribed-providers",
  "allow-set-provider-active",
  "allow-cache-media-metadata",
  "allow-get-cached-media",
  "allow-resolve-deep-links",
  "allow-get-cached-deep-links",
  "allow-record-watch-progress",
  "allow-mark-title-completed",
  "allow-get-continue-watching",
  "allow-get-watch-history",
  "allow-get-title-progress",
  "allow-delete-watch-history-entry",
  "allow-import-watch-history",
  "allow-export-watch-history",
  "allow-log-playback-event",
  "allow-list-playback-events",
  "allow-list-custom-hubs",
  "allow-upsert-custom-hubs",
  "allow-delete-custom-hub",
  "allow-add-to-watchlist",
  "allow-remove-from-watchlist",
  "allow-get-watchlist",
  "allow-is-in-watchlist",
  "allow-open-player",
  "allow-close-player",
  "allow-get-player-status",
  "allow-player-rebind-title",
  "allow-import-ott-history",
  "allow-import-history-file"
]

[[set]]
identifier = "ott-player"
description = "The only commands third-party OTT pages in player/importer windows can reach (each additionally requires the per-session token)."
permissions = [
  "allow-sync-playback-telemetry",
  "allow-player-back-to-hub",
  "allow-report-ott-profile",
  "allow-submit-scraped-history"
]
