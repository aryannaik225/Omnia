[package]
name = "omnia"
version = "1.2.0"
description = "Omnia - Universal OTT Aggregator, Discovery Engine & Smart Playback Hub"
edition = "2021"
rust-version = "1.82"

[lib]
# `_lib` suffix avoids a Windows name clash between the lib and bin targets.
name = "omnia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
log = "0.4"
getrandom = "0.2"

# The full local-first backend: desktop only. Android builds are a thin client of the desktop.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tokio-rusqlite = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "gzip", "brotli"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic"] }
sha2 = "0.10"
unicode-normalization = "0.1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# LAN companion server (phones / TVs on the same Wi-Fi).
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Signed self-updates from GitHub Releases (latest.json).
tauri-plugin-updater = "2"

# Android TV thin client: hands playback to the installed OTT apps (Android intents).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
