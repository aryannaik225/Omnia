name: Release (Windows)

# Push a version tag to build the Windows installers and publish a GitHub Release:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # build.rs bakes these into the Rust binary only (never into the JS bundle; the UI reaches
      # TMDB through the `tmdb_get` command). No .env file is needed on the runner.
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Optional cloud sync: public project URL + anon / publishable key (empty = sync disabled).
      # build.rs refuses a service-role / secret key.
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require the TMDB_API_KEY secret
        shell: bash
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "::error::Repository secret TMDB_API_KEY is missing or empty (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Repository secret TAURI_PRIVATE_KEY is missing: updater artifacts can't be signed."
            exit 1
          fi
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY are not set: this release will ship with cloud sync disabled."
          fi
        env:
          SIGNING_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}

      # The installers and latest.json take their version from tauri.conf.json, not the tag. A
      # mismatch would publish e.g. "v1.2.0" assets that still say 1.1.0, and installed copies
      # would never see the update.
      - name: Check the tag matches the app version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          pkg=$(node -p "require('./package.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$tag tauri.conf.json=$conf package.json=$pkg Cargo.toml=$cargo"
          if [ "$tag" != "$conf" ] || [ "$tag" != "$pkg" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::Tag v$tag doesn't match the app version (tauri.conf.json $conf, package.json $pkg, Cargo.toml $cargo). Bump all three before tagging."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # Builds the frontend, compiles the release binary and bundles NSIS (setup.exe) + MSI,
      # then creates the release for this tag and uploads the installers to it.
      - name: Build and publish installers
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Updater signing (Tauri 2 variable names). Signs the installers (.sig) and makes
          # tauri-action upload latest.json, which installed copies poll for updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Omnia ${{ github.ref_name }}"
          releaseBody: |
            Windows installers for Omnia ${{ github.ref_name }}.

            - `Omnia_*_x64-setup.exe`: recommended installer (per-user, no admin needed)
            - `Omnia_*_x64_en-US.msi`: MSI installer
            - `setup_instructions.txt`: step-by-step setup guide
          includeUpdaterJson: true
          releaseDraft: false
          prerelease: false

      - name: Attach setup instructions
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" setup_instructions.txt --clobber
